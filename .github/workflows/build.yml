name: Build add-on

# Builds the .ankiaddon packages with make.py and uploads them as a workflow artifact.
# Releases (always created as drafts with the packages attached):
# - Actions tab -> Build add-on -> Run workflow, with a version like 0.4: tags the selected
#   branch's commit as v0.4 after a successful build and creates the release.
# - Pushing a v* tag from git: creates the release for that tag.
# Pull requests and manual runs without a version only build.
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.4 (tagged as v0.4). Leave empty to only build."
        required: false
        type: string

permissions:
  contents: write

env:
  # The Windows MeCab binaries, the IPAdic dictionary and the previous pitch accent data (used
  # as fallback) aren't part of the repository. They're taken from the upstream v0.2 release,
  # pinned by checksum.
  BUNDLE_REPO: Ben-Kerman/anki-jrp
  BUNDLE_TAG: v0.2
  BUNDLE_FILE: japanese-readings-and-pitch-accent_0.2_ipadic.ankiaddon
  BUNDLE_SHA256: b852fd6b5e000a2af181e6345d2a6e7f4fd3f09f8ce4bfdf7959e089d7c8f926
  # Pitch accents (CC BY-SA 4.0), pinned to the last commit that changed the file
  KANJIUM_URL: https://raw.githubusercontent.com/mifunetoshiro/kanjium/685d4d723d6d20bf9beb169103aeac188eb067ad/data/source_files/raw/accents.txt
  KANJIUM_SHA256: 8bd0dd127dab32ceec94cb03ab1ba6b68858ea73421dfa1731af2f373deb4f20
  # Word variants (CC BY-SA 4.0); EDRDG regenerates it daily, so it can't be pinned
  JMDICT_URL: https://www.edrdg.org/pub/Nihongo/JMdict.gz

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # Same TypeScript line the upstream releases were built with; make.py relies on its CLI flags.
      - name: Install TypeScript
        run: npm install --global typescript@4.9.4

      # The version comes from the pushed tag or the Run workflow input (v0.3 / 0.3 -> 0.3).
      # It's written into version.py for the build only (package filenames and the add-on's
      # update detection use it).
      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            raw="$GITHUB_REF_NAME"; create_tag=false
          elif [ -n "$INPUT_VERSION" ]; then
            raw="$INPUT_VERSION"; create_tag=true
          else
            echo "No version given, only building."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="${raw#v}"
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+)*([.-][0-9A-Za-z]+)*$ ]]; then
            echo "::error::'$raw' isn't a version like 0.3 or 0.3.1"
            exit 1
          fi
          if [ "$create_tag" = true ] && git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "::error::Tag v$version already exists"
            exit 1
          fi
          sed -i -E "s/^script = \".*\"$/script = \"$version\"/" src/pylib/version.py
          grep -q "^script = \"$version\"$" src/pylib/version.py
          {
            echo "release=true"
            echo "tag=v$version"
            echo "create_tag=$create_tag"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing v$version"

      - name: Fetch bundled data and MeCab
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/bundle"
          cd "$RUNNER_TEMP/bundle"
          gh release download "$BUNDLE_TAG" --repo "$BUNDLE_REPO" --pattern "$BUNDLE_FILE"
          echo "$BUNDLE_SHA256  $BUNDLE_FILE" | sha256sum --check -
          python -I -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall('pkg')" "$BUNDLE_FILE"
          mkdir data bin ipadic
          cp pkg/data/accents.xz fallback-accents.xz
          cp pkg/bin/mecab.exe pkg/bin/libmecab.dll bin/
          cp pkg/data/ipadic/* ipadic/

      - name: Build dictionary data
        run: |
          cd "$RUNNER_TEMP/bundle"
          curl -fsSL -o kanjium-accents.txt "$KANJIUM_URL"
          echo "$KANJIUM_SHA256  kanjium-accents.txt" | sha256sum --check -
          curl -fsSL -o JMdict.gz "$JMDICT_URL"
          sha256sum JMdict.gz
          python -B "$GITHUB_WORKSPACE/tools/build_data.py" data JMdict.gz kanjium-accents.txt fallback-accents.xz

      # MeCab libraries for in-process use on macOS and Linux, from pinned fugashi wheels
      - name: Fetch MeCab libraries
        run: python -I tools/fetch_mecab_libs.py "$RUNNER_TEMP/bundle/lib"

      - name: Build
        run: python make.py "$RUNNER_TEMP/bundle/data" "$RUNNER_TEMP/bundle/bin" "$RUNNER_TEMP/bundle/ipadic" "$RUNNER_TEMP/bundle/lib"

      - name: Check packages
        run: |
          ls -l target/
          python - <<'EOF'
          import glob, zipfile
          files = sorted(glob.glob("target/*.ankiaddon"))
          assert len(files) == 3, files
          for f in files:
              names = zipfile.ZipFile(f).namelist()
              for required in ("__init__.py", "manifest.json", "js/cards.js", "ankilib/editor.py", "style/front.css"):
                  assert required in names, f"{required} missing from {f}"
              if "_full" in f or "_no-dictionary" in f:
                  for required in ("lib/libmecab-macos.dylib", "lib/libmecab-linux-x86_64.so",
                                   "lib/libmecab-linux-aarch64.so", "lib/mecabrc", "lib/LICENSE.mecab"):
                      assert required in names, f"{required} missing from {f}"
              print(f, len(names), "files")
          EOF

      # Unit tests, end-to-end conversion with the bundled MeCab library and the data built
      # above, and parity between the Python parsers and the packaged card script
      - name: Run tests
        env:
          JRP_REQUIRE_ALL: "1"
          JRP_DATA_DIR: ${{ runner.temp }}/bundle/data
          JRP_IPADIC_DIR: ${{ runner.temp }}/bundle/ipadic
          JRP_MECAB_LIB: ${{ runner.temp }}/bundle/lib/libmecab-linux-x86_64.so
          JRP_MECABRC: ${{ runner.temp }}/bundle/lib/mecabrc
          JRP_CARDS_JS: ${{ runner.temp }}/js/cards.js
        run: |
          python -I -c "import glob, sys, zipfile; zipfile.ZipFile(glob.glob('target/*_full.ankiaddon')[0]).extract('js/cards.js', sys.argv[1])" "$RUNNER_TEMP"
          python -B -m unittest discover -s tests -t . -v

      - uses: actions/upload-artifact@v7
        with:
          name: ankiaddon
          path: target/*
          if-no-files-found: error

      # Only tag once the build has passed. Tags pushed with the workflow token don't start
      # another run.
      - name: Create tag
        if: steps.version.outputs.create_tag == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

      # If a release for the tag already exists (e.g. published from the web UI), attach the
      # packages to it; otherwise create a draft release.
      - name: Create release or attach packages
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" target/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" target/* \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --verify-tag \
              --title "$TAG" \
              --generate-notes
          fi
